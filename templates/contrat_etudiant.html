{% extends "base.html" %}
{% block title %}Contrat étudiant{% endblock %}
{% block content %}

<div class="page-header">
  <div class="page-header-left">
    <h2>Contrat étudiant</h2>
    <div class="breadcrumb"><a href="/dossier/{{ dossier.id }}">{{ dossier.nom }}</a> · {{ travailleur.prenom }} {{ travailleur.nom }}</div>
  </div>
</div>

<form method="POST">
<div class="two-col">
  <div class="card">
    <div class="card-header"><h3>Données employeur</h3></div>
    <div class="card-body form-grid">
      <div class="form-group">
        <label>Société</label>
        <input type="text" name="nom_societe" value="{{ dossier.nom }}" required>
      </div>
      <div class="form-group">
        <label>Adresse</label>
        <input type="text" name="adresse_societe" value="{{ dossier.adresse or '' }}">
      </div>
      <div class="form-group">
        <label>BCE</label>
        <input type="text" name="bce_societe" value="{{ dossier.bce or '' }}">
      </div>
      <div class="form-group">
        <label>N° RSZ</label>
        <input type="text" name="rsz_societe" value="{{ dossier.rsz or '' }}">
      </div>
      <div class="form-group">
        <label>Représentant</label>
        <input type="text" name="representant" value="{{ dossier.representant or '' }}">
      </div>
      <div class="form-group">
        <label>Assurance AT</label>
        <input type="text" name="assurance_at" value="{{ dossier.assurance_at or '' }}" placeholder="Nom assureur">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h3>Données étudiant</h3></div>
    <div class="card-body form-grid">
      <div class="form-group">
        <label>Nom complet</label>
        <input type="text" name="nom_etudiant" value="{{ travailleur.prenom }} {{ travailleur.nom }}" required>
      </div>
      <div class="form-group">
        <label>Adresse</label>
        <input type="text" name="adresse_etudiant" value="{{ travailleur.adresse or '' }}">
      </div>
      <div class="form-group">
        <label>Date de naissance</label>
        <input type="text" name="ddn_etudiant" value="{{ travailleur.date_naissance.strftime('%d/%m/%Y') if travailleur.date_naissance else '' }}" placeholder="JJ/MM/AAAA">
      </div>
      <div class="form-group">
        <label>NISS</label>
        <input type="text" name="niss_etudiant" value="{{ travailleur.niss or '' }}">
      </div>
      <div class="form-group">
        <label>École / établissement</label>
        <input type="text" name="ecole_etudiant" placeholder="Nom de l'école">
      </div>
      <div class="form-group">
        <label>État civil</label>
        <select name="etat_civil">
          <option value="célibataire">Célibataire</option>
          <option value="marié(e)">Marié(e)</option>
          <option value="cohabitant(e) légal(e)">Cohabitant(e) légal(e)</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div class="two-col">
  <div class="card">
    <div class="card-header"><h3>Conditions du contrat</h3></div>
    <div class="card-body form-grid">
      <div class="form-group">
        <label>Commission paritaire</label>
        <select name="commission_paritaire_key" required>
          {% for cp_key, cp_val in cp_data.items() %}
          <option value="{{ cp_key }}" {% if dossier.cp_principale == cp_key %}selected{% endif %}>{{ cp_key }} — {{ cp_val.meta.nom }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Fonction</label>
        <input type="text" name="fonction" placeholder="Ex: Assistant administratif" required>
      </div>
      <div class="form-group">
        <label>Lieu de travail</label>
        <input type="text" name="lieu_travail" value="{{ dossier.adresse or '' }}">
      </div>
      <div class="form-group">
        <label>Date de début</label>
        <input type="text" name="date_debut" placeholder="JJ/MM/AAAA" required>
      </div>
      <div class="form-group">
        <label>Date de fin</label>
        <input type="text" name="date_fin" placeholder="JJ/MM/AAAA" required>
      </div>
      <div class="form-group">
        <label>Nombre de jours ouvrables</label>
        <input type="number" name="nb_jours" min="1" placeholder="Ex: 10" required>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h3>Rémunération</h3></div>
    <div class="card-body form-grid">
      <div class="form-group">
        <label>Heures par jour</label>
        <input type="number" name="heures_jour" step="0.1" value="7.6" required>
      </div>
      <div class="form-group">
        <label>Horaire journalier</label>
        <input type="text" name="horaire_journalier" placeholder="Ex: 08h00-16h00">
      </div>
      <div class="form-group">
        <label>Salaire horaire brut (€)</label>
        <input type="number" name="salaire_horaire" step="0.01" placeholder="Ex: 13.50" required>
      </div>
      <div class="form-group">
        <label>Lieu de signature</label>
        <input type="text" name="lieu_signature" value="Bruxelles">
      </div>
    </div>
  </div>
</div>

<div style="text-align:right;margin-top:16px;display:flex;gap:10px;justify-content:flex-end;">
  <a href="/travailleur/{{ travailleur.id }}" class="btn btn-secondary">Annuler</a>
  <button type="submit" class="btn btn-primary">Générer le contrat étudiant + fiche de paie</button>
</div>
</form>
{% endblock %}
