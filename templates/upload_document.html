{% extends "base.html" %}
{% block title %}Ajouter un document{% endblock %}
{% block content %}

<div class="page-header">
  <div class="page-header-left">
    <h2>Ajouter un document</h2>
    <div class="breadcrumb"><a href="/travailleur/{{ travailleur.id }}">{{ travailleur.prenom }} {{ travailleur.nom }}</a> · Documents</div>
  </div>
</div>

<div class="card" style="max-width:600px">
  <div class="card-header"><h3>Document pour {{ travailleur.prenom }} {{ travailleur.nom }}</h3></div>
  <div class="card-body">
    <form method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label class="form-label">Type de document</label>
        <select name="type_document" class="form-control">
          <option value="carte_identite">Carte d'identité</option>
          <option value="contrat_signe">Contrat signé</option>
          <option value="attestation">Attestation</option>
          <option value="certificat_medical">Certificat médical</option>
          <option value="fiche_paie">Fiche de paie</option>
          <option value="document_onss">Document ONSS</option>
          <option value="autre">Autre</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Nom du document</label>
        <input type="text" name="nom" class="form-control" placeholder="Ex: CI de Jean Dupont (recto-verso)" required>
      </div>
      <div class="form-group">
        <label class="form-label">Fichier</label>
        <label class="upload-zone" for="file_input">
          <div class="upload-icon"></div>
          <p>Cliquez pour sélectionner un fichier</p>
          <p style="font-size:11px;margin-top:4px">PDF, JPG, PNG — max 10 MB</p>
          <input type="file" id="file_input" name="fichier" accept=".pdf,.jpg,.jpeg,.png" required onchange="document.getElementById('fname').textContent = this.files[0]?.name || ''">
        </label>
        <div id="fname" style="font-size:12px;color:var(--accent);margin-top:6px;font-weight:500"></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Enregistrer le document</button>
        <a href="/travailleur/{{ travailleur.id }}?tab=documents" class="btn btn-secondary">Annuler</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
