<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PayrollTool – Sélection profil</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d1b2a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo { color: white; font-size: 28px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
        .logo span { color: #4fc3f7; }
        .subtitle { color: #78909c; font-size: 14px; margin-bottom: 48px; }
        .profils { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .profil-card {
            background: #1a2744;
            border: 1.5px solid #263a5a;
            border-radius: 14px;
            padding: 32px 28px;
            width: 240px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: block;
        }
        .profil-card:hover { background: #223366; border-color: #4fc3f7; transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .profil-icon { font-size: 36px; margin-bottom: 14px; }
        .profil-nom { color: white; font-size: 15px; font-weight: 700; margin-bottom: 6px; }
        .profil-bce { color: #78909c; font-size: 12px; margin-bottom: 10px; }
        .profil-cp { display: flex; flex-wrap: wrap; gap: 5px; }
        .cp-badge { background: #0d2137; color: #4fc3f7; font-size: 10px; padding: 3px 8px; border-radius: 20px; border: 1px solid #1a4a6e; }
        .arrow { color: #4fc3f7; font-size: 18px; margin-top: 16px; display: block; }
    </style>
</head>
<body>
    <div class="logo">💼 Payroll<span>Tool</span></div>
    <div class="subtitle">Sélectionnez un profil pour commencer</div>
    <div class="profils">
        {% for pid, p in profils.items() %}
        <a href="/profil/{{ pid }}" class="profil-card">
            <div class="profil-icon">{{ p.icon }}</div>
            <div class="profil-nom">{{ p.nom }}</div>
            <div class="profil-bce">BCE {{ p.bce }}</div>
            <div class="profil-cp">
                {% for cp in p.cp_disponibles %}
                <span class="cp-badge">{{ cp }}</span>
                {% endfor %}
            </div>
            <span class="arrow">→</span>
        </a>
        {% endfor %}
    </div>
</body>
</html>
