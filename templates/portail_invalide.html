<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Lien invalide</title>
<style>body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:white;border-radius:12px;padding:48px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
h2{color:#e74c3c;margin-bottom:12px}p{color:#555}</style></head>
<body><div class="card"><div style="margin-bottom:14px;display:flex;justify-content:center">{% if marque.logo_path %}<img src="{{ marque.logo_url }}" alt="{{ marque.nom }}" style="height:48px;display:block">{% else %}<strong style="font-size:20px;color:{{ marque.couleur_primaire }}">{{ marque.nom }}</strong>{% endif %}</div><h2>Lien invalide ou expiré</h2><p>Ce lien d'accès n'est plus valide. Contactez votre secrétariat social.</p><p style="font-size:11px;color:#64748B;margin-top:16px">{{ marque.mentions }}</p></div></body>
</html>
