<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexSocial — Nouveau client</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f0f; color: white; min-height: 100vh; }
header { background: #1a1a1a; border-bottom: 1px solid #2a2a2a; padding: 0 28px; height: 54px; display: flex; align-items: center; gap: 16px; }
.logo { font-size: 20px; font-weight: 900; color: white; }
.logo span { color: #7C3AED; }
.container { max-width: 600px; margin: 40px auto; padding: 0 24px; }
.card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 32px; }
h2 { font-size: 20px; font-weight: 700; margin-bottom: 28px; }
.form-group { margin-bottom: 18px; }
.form-group label { font-size: 11px; font-weight: 600; color: #666; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input, .form-group select {
  width: 100%; padding: 11px 14px;
  background: #111; border: 1.5px solid #333;
  border-radius: 8px; font-size: 14px; color: white;
  font-family: inherit; outline: none;
}
.form-group input:focus { border-color: #7C3AED; }
.hint { font-size: 11px; color: #555; margin-top: 4px; }
.actions { display: flex; gap: 10px; margin-top: 24px; }
.btn { padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; }
.btn-primary { background: #7C3AED; color: white; }
.btn-secondary { background: #2a2a2a; color: #aaa; text-decoration: none; display: flex; align-items: center; }
</style>
</head>
<body>
<header>
  <div class="logo">NEX<span>SOCIAL</span></div>
</header>
<div class="container">
  <div class="card">
    <h2>Nouveau client</h2>
    <form method="POST">
      <div class="form-group">
        <label>Sous-domaine</label>
        <input type="text" name="subdomain" placeholder="ex: monfiduciaire" required>
        <div class="hint">Accessible sur : monfiduciaire.nexsocial.be</div>
      </div>
      <div class="form-group">
        <label>Nom du client</label>
        <input type="text" name="nom" placeholder="ex: Fiduciaire Exemple" required>
      </div>
      <div class="form-group">
        <label>Nom affiché dans l'app</label>
        <input type="text" name="logo_text" placeholder="ex: FidExemple" required>
      </div>
      <div class="form-group">
        <label>Email admin client</label>
        <input type="email" name="email_admin" placeholder="admin@client.be">
      </div>
      <div class="form-group">
        <label>Couleur primaire</label>
        <input type="color" name="couleur_primaire" value="#1F4E79">
      </div>
      <div class="form-group">
        <label>Couleur accent</label>
        <input type="color" name="couleur_accent" value="#4fc3f7">
      </div>
      <div class="form-group">
        <label>Plan</label>
        <select name="plan">
          <option value="standard">Standard</option>
          <option value="premium">Premium</option>
          <option value="enterprise">Enterprise</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nombre max de dossiers</label>
        <input type="number" name="nb_dossiers_max" value="50" min="1">
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">Créer le client</button>
        <a href="/nexsocial/dashboard" class="btn btn-secondary">Annuler</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
