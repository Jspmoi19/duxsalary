<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>DuxSalary — Connexion</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <h1>Dux<span>Salary</span></h1>
      <p>Secrétariat social digital</p>
    </div>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Adresse email</label>
        <input type="email" name="email" class="form-control" placeholder="vous@duxsalary.be" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;">Se connecter</button>
    </form>
  </div>
</div>
</body>
</html>
